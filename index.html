<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сапёр</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --backdrop: #008080;
    --window-bg: #c0c0c0;
    --border-hi: #ffffff;
    --border-lo: #808080;
    --text-color: #000000;
    --titlebar-bg: #000080;
    --titlebar-text: #ffffff;
    --input-bg: #ffffff;
    --input-text: #000000;
    --cell-bg: #c0c0c0;
    --cell-opened-bg: #bdbdbd;
    --board-frame: #808080;
    --toggle-bg: #c0c0c0;
    --toggle-icon: #ffcc33;
    --mine-color: #000000;
    --mine-shine: #ffffff;
    --flag-pole: #000000;
    --n1: #0000ff;
    --n2: #008000;
    --n3: #ff0000;
    --n4: #000080;
    --n5: #800000;
    --n6: #008080;
    --n7: #000000;
    --n8: #808080;
  }

  [data-theme="dark"] {
    --backdrop: #0f3d3d;
    --window-bg: #3a3a3a;
    --border-hi: #8f8f8f;
    --border-lo: #131313;
    --text-color: #e8e8e8;
    --titlebar-bg: #000080;
    --titlebar-text: #ffffff;
    --input-bg: #2b2b2b;
    --input-text: #e8e8e8;
    --cell-bg: #626262;
    --cell-opened-bg: #3a3a3a;
    --board-frame: #131313;
    --toggle-bg: #3a3a3a;
    --toggle-icon: #dcdcdc;
    --mine-color: #f0f0f0;
    --mine-shine: #1a1a1a;
    --flag-pole: #e8e8e8;
    --n1: #5c8bff;
    --n2: #4dc44d;
    --n3: #ff5c5c;
    --n4: #8a8aff;
    --n5: #d97a7a;
    --n6: #4dd6d6;
    --n7: #f0f0f0;
    --n8: #b8b8b8;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--backdrop);
    font-family: "Tahoma", "MS Sans Serif", Arial, sans-serif;
    padding: 20px;
    color: var(--text-color);
    transition: background 0.2s ease;
  }

  .window {
    background: var(--window-bg);
    border: 2px solid var(--border-hi);
    border-right-color: var(--border-lo);
    border-bottom-color: var(--border-lo);
    box-shadow: 2px 2px 0 #000;
    padding: 6px;
    max-width: 96vw;
  }

  .titlebar {
    background: var(--titlebar-bg);
    color: var(--titlebar-text);
    font-size: 13px;
    font-weight: bold;
    padding: 3px 4px 3px 6px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .theme-toggle {
    width: 22px;
    height: 20px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--titlebar-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
    padding: 0;
    flex-shrink: 0;
  }
  .theme-toggle:hover {
    background: rgba(255, 255, 255, 0.15);
  }
  .theme-toggle:active {
    background: rgba(0, 0, 0, 0.2);
  }
  .theme-toggle svg {
    width: 14px;
    height: 14px;
    display: block;
  }

  .difficulty {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
  }
  .difficulty .diff-group {
    display: flex;
    gap: 4px;
  }
  .difficulty button {
    background: var(--window-bg);
    color: var(--text-color);
    border: 2px solid var(--border-hi);
    border-right-color: var(--border-lo);
    border-bottom-color: var(--border-lo);
    padding: 4px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .difficulty .custom-btn {
    margin-left: auto;
    flex: 1;
  }
  .difficulty button:active,
  .difficulty button.active {
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
  }

  .custom-panel {
    display: none;
    background: var(--window-bg);
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
    padding: 8px;
    margin-bottom: 6px;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .custom-panel.show { display: flex; }
  .custom-panel label {
    font-size: 12px;
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .custom-panel input {
    width: 56px;
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
    background: var(--input-bg);
    color: var(--input-text);
    padding: 2px 4px;
    font-size: 12px;
  }
  .custom-panel button {
    background: var(--window-bg);
    color: var(--text-color);
    border: 2px solid var(--border-hi);
    border-right-color: var(--border-lo);
    border-bottom-color: var(--border-lo);
    padding: 5px 12px;
    font-size: 12px;
    cursor: pointer;
    align-self: flex-end;
  }
  .custom-panel button:active {
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
  }

  .panel {
    background: var(--window-bg);
    border: 3px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
    padding: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    gap: 8px;
  }

  .counter {
    background: #000;
    color: #ff0000;
    font-family: "Courier New", monospace;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    padding: 2px 6px;
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
    min-width: 60px;
    text-align: right;
  }

  .smiley {
    width: 36px;
    height: 36px;
    background: var(--window-bg);
    border: 2px solid var(--border-hi);
    border-right-color: var(--border-lo);
    border-bottom-color: var(--border-lo);
    cursor: pointer;
    position: relative;
    padding: 0;
    flex-shrink: 0;
  }
  .smiley:active {
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
  }
  .face {
    position: absolute;
    top: 4px;
    left: 4px;
    width: 24px;
    height: 24px;
    background: #ffe600;
    border-radius: 50%;
    border: 1.5px solid #000;
  }
  .eye {
    position: absolute;
    width: 3px;
    height: 5px;
    background: #000;
    top: 8px;
  }
  .eye.left { left: 6px; }
  .eye.right { right: 6px; }
  .mouth {
    position: absolute;
    left: 6px;
    top: 12px;
    width: 12px;
    height: 6px;
    border-bottom: 2px solid #000;
    border-radius: 0 0 8px 8px;
  }
  .smiley.dead .eye {
    background: transparent;
    height: 0;
  }
  .smiley.dead .eye.left::before,
  .smiley.dead .eye.left::after,
  .smiley.dead .eye.right::before,
  .smiley.dead .eye.right::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 1.5px;
    background: #000;
    top: 3px;
    left: -1px;
  }
  .smiley.dead .eye::before { transform: rotate(45deg); }
  .smiley.dead .eye::after { transform: rotate(-45deg); }
  .smiley.dead .mouth {
    border-bottom: none;
    border-top: 2px solid #000;
    border-radius: 8px 8px 0 0;
    top: 16px;
  }
  .smiley.win .face { background: #ffe600; }
  .smiley.win .eye {
    height: 3px;
    top: 9px;
    background: #000;
  }
  .smiley.win .mouth {
    width: 14px;
    height: 8px;
    left: 5px;
    top: 10px;
    border-bottom: 2px solid #000;
    border-radius: 0 0 10px 10px;
  }

  .hint-btn {
    width: 36px;
    height: 36px;
    background: var(--window-bg);
    border: 2px solid var(--border-hi);
    border-right-color: var(--border-lo);
    border-bottom-color: var(--border-lo);
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hint-btn svg {
    width: 18px;
    height: 18px;
    display: block;
  }
  .hint-btn .bulb-glass { fill: #ffe066; stroke: #705c00; stroke-width: 1; }
  .hint-btn .bulb-base { fill: var(--border-lo); }
  .hint-btn:active {
    border: 2px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
  }
  .hint-btn:disabled {
    cursor: default;
    opacity: 0.5;
  }

  .board-scroll {
    overflow: auto;
    max-width: 100%;
    max-height: 75vh;
  }

  #board {
    display: grid;
    background: var(--board-frame);
    border: 3px solid var(--border-lo);
    border-right-color: var(--border-hi);
    border-bottom-color: var(--border-hi);
    width: fit-content;
  }

  .cell {
    width: 26px;
    height: 26px;
    background: var(--cell-bg);
    border: 2px solid var(--border-hi);
    border-right-color: var(--border-lo);
    border-bottom-color: var(--border-lo);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .cell.opened {
    background: var(--cell-opened-bg);
    border: 1px solid var(--border-lo);
    cursor: default;
  }
  .cell.mine.opened {
    background: var(--cell-opened-bg);
  }
  .cell.exploded {
    background: #ff0000;
  }
  .cell.hinted {
    box-shadow: inset 0 0 0 2px #0000ff;
  }

  .flag {
    position: relative;
    width: 12px;
    height: 14px;
  }
  .flag::before {
    content: "";
    position: absolute;
    left: 1px;
    top: 0;
    width: 2px;
    height: 14px;
    background: var(--flag-pole);
  }
  .flag::after {
    content: "";
    position: absolute;
    left: 3px;
    top: 0;
    width: 0;
    height: 0;
    border-top: 3px solid transparent;
    border-bottom: 3px solid transparent;
    border-left: 8px solid #ff0000;
  }

  .mine-icon {
    width: 14px;
    height: 14px;
    background: var(--mine-color);
    border-radius: 50%;
    position: relative;
  }
  .mine-icon::before {
    content: "";
    position: absolute;
    top: -3px;
    left: 6px;
    width: 2px;
    height: 20px;
    background: var(--mine-color);
  }
  .mine-icon::after {
    content: "";
    position: absolute;
    top: 6px;
    left: -3px;
    width: 20px;
    height: 2px;
    background: var(--mine-color);
  }
  .mine-icon .shine {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 3px;
    height: 3px;
    background: var(--mine-shine);
    border-radius: 50%;
  }

  .wrong-flag {
    position: relative;
    width: 14px;
    height: 14px;
  }
  .wrong-flag::before,
  .wrong-flag::after {
    content: "";
    position: absolute;
    top: 6px;
    left: -1px;
    width: 16px;
    height: 2px;
    background: #ff0000;
  }
  .wrong-flag::before { transform: rotate(45deg); }
  .wrong-flag::after { transform: rotate(-45deg); }

  .n1 { color: var(--n1); }
  .n2 { color: var(--n2); }
  .n3 { color: var(--n3); }
  .n4 { color: var(--n4); }
  .n5 { color: var(--n5); }
  .n6 { color: var(--n6); }
  .n7 { color: var(--n7); }
  .n8 { color: var(--n8); }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <span>Сапёр</span>
    <button class="theme-toggle" id="themeToggle" title="Переключить тему" aria-label="Переключить тему"></button>
  </div>

  <div class="difficulty">
    <div class="diff-group">
      <button data-level="easy" class="active">11 x 11</button>
      <button data-level="medium">16 x 16</button>
      <button data-level="hard">16 x 30</button>
    </div>
    <button data-level="custom" class="custom-btn">Custom</button>
  </div>

  <div class="custom-panel" id="customPanel">
    <label>Строки
      <input type="number" id="customRows" value="9" min="5" max="30">
    </label>
    <label>Столбцы
      <input type="number" id="customCols" value="9" min="5" max="40">
    </label>
    <label>Мины
      <input type="number" id="customMines" value="10" min="1" max="400">
    </label>
    <button id="applyCustom">Go</button>
  </div>

  <div class="panel">
    <div class="counter" id="mineCount">010</div>
    <button class="hint-btn" id="hintBtn" title="Подсказка" aria-label="Подсказка">
      <svg viewBox="0 0 24 24">
        <path class="bulb-glass" d="M12 2a7 7 0 0 0-4 12.7c.6.45 1 1.2 1 2v.3h6v-.3c0-.8.4-1.55 1-2A7 7 0 0 0 12 2z"/>
        <rect class="bulb-base" x="9.5" y="17.5" width="5" height="1.8" rx="0.4"/>
        <rect class="bulb-base" x="10" y="19.8" width="4" height="1.5" rx="0.5"/>
      </svg>
    </button>
    <button class="smiley" id="resetBtn">
      <div class="face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
    </button>
    <div class="counter" id="timer">000</div>
  </div>

  <div class="board-scroll">
    <div id="board"></div>
  </div>
</div>

<script>
const levels = {
  easy:   { rows: 11,  cols: 11,  mines: 15 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard:   { rows: 16, cols: 30, mines: 99 }
};

let currentLevel = 'easy';
let customConfig = { rows: 9, cols: 9, mines: 10 };
let board = [];
let rows, cols, mineTotal;
let firstClick = true;
let gameOver = false;
let flagsPlaced = 0;
let openedCount = 0;
let timerInterval = null;
let seconds = 0;

const boardEl = document.getElementById('board');
const mineCountEl = document.getElementById('mineCount');
const timerEl = document.getElementById('timer');
const resetBtn = document.getElementById('resetBtn');
const hintBtn = document.getElementById('hintBtn');
const customPanel = document.getElementById('customPanel');
const themeToggle = document.getElementById('themeToggle');

const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.5 8.5 0 0 1 9.3 3.6a.6.6 0 0 0-.75-.8A9.7 9.7 0 1 0 21.2 15.45a.6.6 0 0 0-.8-.75z"/></svg>';
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="4.5"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.2" y1="4.2" x2="6" y2="6"/><line x1="18" y1="18" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6" y2="18"/><line x1="18" y1="6" x2="19.8" y2="4.2"/></g></svg>';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
  try { localStorage.setItem('saper-theme', theme); } catch (e) {}
}

function initTheme() {
  let saved = 'light';
  try { saved = localStorage.getItem('saper-theme') || 'light'; } catch (e) {}
  applyTheme(saved);
}

themeToggle.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(current === 'dark' ? 'light' : 'dark');
});

initTheme();

document.querySelectorAll('.difficulty button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.difficulty button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLevel = btn.dataset.level;
    if (currentLevel === 'custom') {
      customPanel.classList.add('show');
    } else {
      customPanel.classList.remove('show');
      initGame();
    }
  });
});

document.getElementById('applyCustom').addEventListener('click', () => {
  let r = parseInt(document.getElementById('customRows').value, 10);
  let c = parseInt(document.getElementById('customCols').value, 10);
  let m = parseInt(document.getElementById('customMines').value, 10);

  r = Math.min(30, Math.max(5, isNaN(r) ? 9 : r));
  c = Math.min(40, Math.max(5, isNaN(c) ? 9 : c));
  const maxMines = r * c - 9;
  m = Math.min(maxMines, Math.max(1, isNaN(m) ? 10 : m));

  document.getElementById('customRows').value = r;
  document.getElementById('customCols').value = c;
  document.getElementById('customMines').value = m;

  customConfig = { rows: r, cols: c, mines: m };
  initGame();
});

resetBtn.addEventListener('click', initGame);
hintBtn.addEventListener('click', useHint);

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.code === 'KeyR') {
    e.preventDefault();
    e.stopPropagation();
    resetBtn.click();
  }
}, true);

function pad(n) {
  return String(n).padStart(3, '0');
}

function key(r, c) { return r + ',' + c; }

function getNeighbors(r, c) {
  const result = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) result.push([nr, nc]);
    }
  }
  return result;
}

function initGame() {
  let lvl;
  if (currentLevel === 'custom') {
    lvl = customConfig;
  } else {
    lvl = levels[currentLevel];
  }
  rows = lvl.rows;
  cols = lvl.cols;
  mineTotal = lvl.mines;
  firstClick = true;
  gameOver = false;
  flagsPlaced = 0;
  openedCount = 0;
  seconds = 0;
  clearInterval(timerInterval);
  timerInterval = null;
  timerEl.textContent = pad(0);
  mineCountEl.textContent = pad(mineTotal);
  resetBtn.className = 'smiley';
  resetBtn.innerHTML = `
    <div class="face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>`;

  board = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      row.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
    }
    board.push(row);
  }

  renderBoard();
}

function renderBoard() {
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${cols}, 26px)`;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cellEl = document.createElement('div');
      cellEl.className = 'cell';
      cellEl.dataset.r = r;
      cellEl.dataset.c = c;

      cellEl.addEventListener('click', () => handleLeftClick(r, c));
      cellEl.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        handleRightClick(r, c);
      });

      let touchTimer = null;
      cellEl.addEventListener('touchstart', () => {
        touchTimer = setTimeout(() => {
          handleRightClick(r, c);
          touchTimer = null;
        }, 450);
      });
      cellEl.addEventListener('touchend', (e) => {
        if (touchTimer) {
          clearTimeout(touchTimer);
          e.preventDefault();
          handleLeftClick(r, c);
        }
      });

      boardEl.appendChild(cellEl);
    }
  }
}

// Generate

function computeAdjacents(b) {
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (b[r][c].mine) continue;
      let count = 0;
      for (const [nr, nc] of getNeighbors(r, c)) {
        if (b[nr][nc].mine) count++;
      }
      b[r][c].adjacent = count;
    }
  }
}

function placeMinesRandom(b, excludeR, excludeC) {
  let placed = 0;
  const forbidden = new Set();
  for (const [nr, nc] of getNeighbors(excludeR, excludeC)) forbidden.add(key(nr, nc));
  forbidden.add(key(excludeR, excludeC));

  while (placed < mineTotal) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    if (b[r][c].mine) continue;
    if (forbidden.has(key(r, c))) continue;
    b[r][c].mine = true;
    placed++;
  }
}


function buildConstraints(b, ignoreSafe, ignoreMine) {
  const constraints = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = b[r][c];
      if (!cell.revealed || cell.mine || cell.adjacent === 0) continue;
      const unknown = [];
      let accountedMines = 0;
      for (const [nr, nc] of getNeighbors(r, c)) {
        const n = b[nr][nc];
        const k = key(nr, nc);
        if (n.revealed) continue;
        if (n.flagged || ignoreMine.has(k)) { accountedMines++; continue; }
        if (ignoreSafe.has(k)) continue;
        unknown.push([nr, nc]);
      }
      if (unknown.length === 0) continue;
      constraints.push({ cells: unknown, required: cell.adjacent - accountedMines });
    }
  }
  return constraints;
}


function deduceStep(b) {
  const deducedSafe = new Set();
  const deducedMine = new Set();

  function applyQuickRules() {
    let changed = true;
    while (changed) {
      changed = false;
      const constraints = buildConstraints(b, deducedSafe, deducedMine)
        .map(cons => ({
          cells: cons.cells.filter(([r, c]) => !deducedSafe.has(key(r, c)) && !deducedMine.has(key(r, c))),
          required: cons.required
        }))
        .filter(cons => cons.cells.length > 0);

      for (const cons of constraints) {
        if (cons.required <= 0) {
          for (const [r, c] of cons.cells) {
            const k = key(r, c);
            if (!deducedSafe.has(k)) { deducedSafe.add(k); changed = true; }
          }
        } else if (cons.required === cons.cells.length) {
          for (const [r, c] of cons.cells) {
            const k = key(r, c);
            if (!deducedMine.has(k)) { deducedMine.add(k); changed = true; }
          }
        }
      }

      for (let i = 0; i < constraints.length; i++) {
        for (let j = 0; j < constraints.length; j++) {
          if (i === j) continue;
          const A = constraints[i], B = constraints[j];
          if (A.cells.length === 0 || A.cells.length >= B.cells.length) continue;
          const setA = new Set(A.cells.map(([r, c]) => key(r, c)));
          const setB = B.cells;
          let isSubset = true;
          for (const [r, c] of A.cells) {
            if (!setB.some(([r2, c2]) => r2 === r && c2 === c)) { isSubset = false; break; }
          }
          if (!isSubset) continue;
          const diffCells = setB.filter(([r, c]) => !setA.has(key(r, c)));
          const diffRequired = B.required - A.required;
          if (diffCells.length === 0) continue;
          if (diffRequired === 0) {
            for (const [r, c] of diffCells) {
              const k = key(r, c);
              if (!deducedSafe.has(k)) { deducedSafe.add(k); changed = true; }
            }
          } else if (diffRequired === diffCells.length) {
            for (const [r, c] of diffCells) {
              const k = key(r, c);
              if (!deducedMine.has(k)) { deducedMine.add(k); changed = true; }
            }
          }
        }
      }

      let flaggedOrDeducedMine = deducedMine.size;
      let unknownCells = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = b[r][c];
          if (cell.revealed) continue;
          const k = key(r, c);
          if (cell.flagged) { flaggedOrDeducedMine++; continue; }
          if (deducedMine.has(k)) continue;
          if (deducedSafe.has(k)) continue;
          unknownCells.push([r, c]);
        }
      }
      const remainingMines = mineTotal - flaggedOrDeducedMine;
      if (remainingMines === 0 && unknownCells.length > 0) {
        for (const [r, c] of unknownCells) {
          const k = key(r, c);
          if (!deducedSafe.has(k)) { deducedSafe.add(k); changed = true; }
        }
      } else if (remainingMines === unknownCells.length && remainingMines > 0) {
        for (const [r, c] of unknownCells) {
          const k = key(r, c);
          if (!deducedMine.has(k)) { deducedMine.add(k); changed = true; }
        }
      }
    }
  }

  applyQuickRules();

  let cspChanged = true;
  let guard = 0;
  while (cspChanged && guard < 6) {
    cspChanged = false;
    guard++;

    const constraints = buildConstraints(b, deducedSafe, deducedMine)
      .map(cons => ({
        cells: cons.cells.filter(([r, c]) => !deducedSafe.has(key(r, c)) && !deducedMine.has(key(r, c))),
        required: cons.required
      }))
      .filter(cons => cons.cells.length > 0);

    if (constraints.length === 0) break;

    const parent = new Map();
    function find(x) {
      if (!parent.has(x)) parent.set(x, x);
      let root = x;
      while (parent.get(root) !== root) root = parent.get(root);
      let cur = x;
      while (parent.get(cur) !== cur) {
        const next = parent.get(cur);
        parent.set(cur, root);
        cur = next;
      }
      return root;
    }
    function union(a, b2) {
      const ra = find(a), rb = find(b2);
      if (ra !== rb) parent.set(ra, rb);
    }

    for (const cons of constraints) {
      const first = key(cons.cells[0][0], cons.cells[0][1]);
      find(first);
      for (let i = 1; i < cons.cells.length; i++) {
        const k = key(cons.cells[i][0], cons.cells[i][1]);
        find(k);
        union(first, k);
      }
    }

    const groups = new Map();
    for (const cons of constraints) {
      const root = find(key(cons.cells[0][0], cons.cells[0][1]));
      if (!groups.has(root)) groups.set(root, { cellsSet: new Set(), constraints: [] });
      const g = groups.get(root);
      g.constraints.push(cons);
      for (const [r, c] of cons.cells) g.cellsSet.add(key(r, c));
    }

    const LIMIT = 24;
    for (const [, g] of groups) {
      const cellsList = Array.from(g.cellsSet);
      if (cellsList.length > LIMIT) continue;

      const idxMap = new Map(cellsList.map((k, i) => [k, i]));
      const n = cellsList.length;
      const consData = g.constraints.map(cons => {
        const indices = cons.cells.map(([r, c]) => idxMap.get(key(r, c)));
        const maxIdx = Math.max(...indices);
        return { indices, required: cons.required, maxIdx };
      });
      const checksAt = Array.from({ length: n }, () => []);
      consData.forEach(cd => checksAt[cd.maxIdx].push(cd));

      const assignment = new Array(n).fill(0);
      const validAssignments = [];
      let calls = 0;
      const CALL_LIMIT = 300000;
      let aborted = false;

      function backtrack(idx) {
        if (aborted) return;
        calls++;
        if (calls > CALL_LIMIT) { aborted = true; return; }
        if (idx === n) {
          validAssignments.push(assignment.slice());
          return;
        }
        for (const val of [0, 1]) {
          assignment[idx] = val;
          let ok = true;
          for (const cd of checksAt[idx]) {
            let sum = 0;
            for (const i of cd.indices) sum += assignment[i];
            if (sum !== cd.required) { ok = false; break; }
          }
          if (ok) {
            backtrack(idx + 1);
            if (aborted) return;
          }
        }
      }
      backtrack(0);

      if (aborted || validAssignments.length === 0) continue;

      for (let i = 0; i < n; i++) {
        let allMine = true, allSafe = true;
        for (const a of validAssignments) {
          if (a[i] === 1) allSafe = false; else allMine = false;
          if (!allMine && !allSafe) break;
        }
        const cellKey = cellsList[i];
        if (allMine) {
          if (!deducedMine.has(cellKey)) { deducedMine.add(cellKey); cspChanged = true; }
        } else if (allSafe) {
          if (!deducedSafe.has(cellKey)) { deducedSafe.add(cellKey); cspChanged = true; }
        }
      }
    }

    if (cspChanged) applyQuickRules();
  }

  return { safe: deducedSafe, mines: deducedMine };
}

function simFloodReveal(b, r, c) {
  const stack = [[r, c]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const cell = b[cr][cc];
    if (cell.revealed) continue;
    cell.revealed = true;
    if (cell.adjacent === 0) {
      for (const [nr, nc] of getNeighbors(cr, cc)) {
        if (!b[nr][nc].revealed) stack.push([nr, nc]);
      }
    }
  }
}

function trySolve(b, firstR, firstC) {
  simFloodReveal(b, firstR, firstC);
  const totalSafe = rows * cols - mineTotal;

  let openedSim = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (b[r][c].revealed) openedSim++;

  while (openedSim < totalSafe) {
    const { safe, mines } = deduceStep(b);
    if (safe.size === 0 && mines.size === 0) return false;

    for (const k of mines) {
      const [r, c] = k.split(',').map(Number);
      b[r][c].flagged = true;
    }
    for (const k of safe) {
      const [r, c] = k.split(',').map(Number);
      if (!b[r][c].revealed) {
        simFloodReveal(b, r, c);
      }
    }

    openedSim = 0;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (b[r][c].revealed) openedSim++;
  }
  return true;
}

function trySolveWithRepair(b, firstR, firstC) {
  simFloodReveal(b, firstR, firstC);
  const totalSafe = rows * cols - mineTotal;

  const forbidden = new Set();
  for (const [nr, nc] of getNeighbors(firstR, firstC)) forbidden.add(key(nr, nc));
  forbidden.add(key(firstR, firstC));

  let openedSim = 0;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (b[r][c].revealed) openedSim++;

  let repairs = 0;
  const REPAIR_LIMIT = 500;

  while (openedSim < totalSafe) {
    const { safe, mines } = deduceStep(b);

    if (safe.size === 0 && mines.size === 0) {
      const constraints = buildConstraints(b, new Set(), new Set());
      const boundary = new Set();
      for (const cons of constraints) {
        for (const [r, c] of cons.cells) boundary.add(key(r, c));
      }

      const boundaryMines = [];
      for (const k of boundary) {
        const [r, c] = k.split(',').map(Number);
        if (b[r][c].mine) boundaryMines.push([r, c]);
      }

      const interiorPool = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = b[r][c];
          const k = key(r, c);
          if (cell.revealed || cell.flagged || cell.mine) continue;
          if (boundary.has(k) || forbidden.has(k)) continue;
          interiorPool.push([r, c]);
        }
      }

      if (boundaryMines.length === 0 || interiorPool.length === 0 || repairs >= REPAIR_LIMIT) {
        return false;
      }

      const [fr, fc] = boundaryMines[Math.floor(Math.random() * boundaryMines.length)];
      const [tr, tc] = interiorPool[Math.floor(Math.random() * interiorPool.length)];
      b[fr][fc].mine = false;
      b[tr][tc].mine = true;
      computeAdjacents(b);
      repairs++;
      continue;
    }

    for (const k of mines) {
      const [r, c] = k.split(',').map(Number);
      b[r][c].flagged = true;
    }
    for (const k of safe) {
      const [r, c] = k.split(',').map(Number);
      if (!b[r][c].revealed) simFloodReveal(b, r, c);
    }

    openedSim = 0;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (b[r][c].revealed) openedSim++;
  }
  return true;
}

function generateSolvableBoard(firstR, firstC) {
  const cellCount = rows * cols;
  let maxAttempts = 200;
  if (cellCount > 300) maxAttempts = 60;
  if (cellCount > 600) maxAttempts = 25;

  let lastAttempt = null;

  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const testBoard = [];
    for (let r = 0; r < rows; r++) {
      const row = [];
      for (let c = 0; c < cols; c++) row.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
      testBoard.push(row);
    }
    placeMinesRandom(testBoard, firstR, firstC);
    computeAdjacents(testBoard);
    lastAttempt = testBoard;

    if (trySolveWithRepair(testBoard, firstR, firstC)) {
      const finalBoard = [];
      for (let r = 0; r < rows; r++) {
        const row = [];
        for (let c = 0; c < cols; c++) {
          row.push({ mine: testBoard[r][c].mine, adjacent: testBoard[r][c].adjacent, revealed: false, flagged: false });
        }
        finalBoard.push(row);
      }
      return finalBoard;
    }
  }

  const finalBoard = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) {
      row.push({ mine: lastAttempt[r][c].mine, adjacent: lastAttempt[r][c].adjacent, revealed: false, flagged: false });
    }
    finalBoard.push(row);
  }
  return finalBoard;
}

// Game

function handleLeftClick(r, c) {
  if (gameOver) return;
  const cell = board[r][c];
  if (cell.flagged || cell.revealed) return;

  if (firstClick) {
    board = generateSolvableBoard(r, c);
    firstClick = false;
    startTimer();
  }

  if (board[r][c].mine) {
    revealCell(r, c);
    endGame(false, r, c);
    return;
  }

  floodReveal(r, c);
  checkWin();
}

function handleRightClick(r, c) {
  if (gameOver || firstClick) return;
  const cell = board[r][c];
  if (cell.revealed) return;

  cell.flagged = !cell.flagged;
  flagsPlaced += cell.flagged ? 1 : -1;
  mineCountEl.textContent = pad(mineTotal - flagsPlaced);
  updateCellDisplay(r, c);
}

function floodReveal(r, c) {
  const stack = [[r, c]];
  while (stack.length) {
    const [cr, cc] = stack.pop();
    const cell = board[cr][cc];
    if (cell.revealed || cell.flagged) continue;
    revealCell(cr, cc);

    if (cell.adjacent === 0) {
      for (const [nr, nc] of getNeighbors(cr, cc)) {
        if (!board[nr][nc].revealed) stack.push([nr, nc]);
      }
    }
  }
}

function revealCell(r, c) {
  const cell = board[r][c];
  if (cell.revealed) return;
  cell.revealed = true;
  if (!cell.mine) openedCount++;
  updateCellDisplay(r, c);
}

function updateCellDisplay(r, c) {
  const cell = board[r][c];
  const el = boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
  if (!el) return;

  el.className = 'cell';
  el.innerHTML = '';

  if (cell.revealed) {
    el.classList.add('opened');
    if (cell.mine) {
      el.classList.add('mine');
      const mine = document.createElement('div');
      mine.className = 'mine-icon';
      const shine = document.createElement('div');
      shine.className = 'shine';
      mine.appendChild(shine);
      el.appendChild(mine);
    } else if (cell.adjacent > 0) {
      el.textContent = cell.adjacent;
      el.classList.add('n' + cell.adjacent);
    }
  } else if (cell.flagged) {
    const flag = document.createElement('div');
    flag.className = 'flag';
    el.appendChild(flag);
  }
}

function useHint() {
  if (gameOver || firstClick) return;

  const { safe, mines } = deduceStep(board);

  if (safe.size > 0) {
    const [r, c] = safe.values().next().value.split(',').map(Number);
    floodReveal(r, c);
    flashHint(r, c);
    checkWin();
    return;
  }

  if (mines.size > 0) {
    const [r, c] = mines.values().next().value.split(',').map(Number);
    if (!board[r][c].flagged) {
      board[r][c].flagged = true;
      flagsPlaced++;
      mineCountEl.textContent = pad(mineTotal - flagsPlaced);
      updateCellDisplay(r, c);
      flashHint(r, c);
    }
    return;
  }

  outer:
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = board[r][c];
      if (!cell.revealed && !cell.flagged && !cell.mine) {
        floodReveal(r, c);
        flashHint(r, c);
        checkWin();
        break outer;
      }
    }
  }
}

function flashHint(r, c) {
  const el = boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
  if (!el) return;
  el.classList.add('hinted');
  setTimeout(() => el.classList.remove('hinted'), 700);
}

function endGame(won, explodedR, explodedC) {
  gameOver = true;
  clearInterval(timerInterval);

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = board[r][c];
      if (cell.mine && !cell.flagged) {
        cell.revealed = true;
        updateCellDisplay(r, c);
      }
      if (!cell.mine && cell.flagged) {
        const el = boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
        if (el) {
          el.innerHTML = '';
          const wf = document.createElement('div');
          wf.className = 'wrong-flag';
          el.appendChild(wf);
        }
      }
    }
  }

  if (!won && explodedR !== undefined) {
    const el = boardEl.querySelector(`[data-r="${explodedR}"][data-c="${explodedC}"]`);
    if (el) el.classList.add('exploded');
  }

  resetBtn.className = won ? 'smiley win' : 'smiley dead';
  resetBtn.innerHTML = `
    <div class="face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>`;
}

function checkWin() {
  if (openedCount === rows * cols - mineTotal) {
    endGame(true);
  }
}

function startTimer() {
  timerInterval = setInterval(() => {
    seconds++;
    if (seconds > 999) seconds = 0;
    timerEl.textContent = pad(seconds);
  }, 1000);
}

initGame();
</script>
